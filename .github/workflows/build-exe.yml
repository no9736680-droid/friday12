name: Build FRIDAY EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build FRIDAY Windows EXE
    runs-on: windows-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 3. Verify project
      - name: Verify FRIDAY project
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "FRIDAY PROJECT CHECK"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Current directory:"
          Get-Location

          Write-Host ""
          Write-Host "Repository files:"
          Get-ChildItem -Force

          $required = @(
            "pyproject.toml",
            "agent_friday.py",
            "server.py"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              Write-Error "Missing required file: $file"
              exit 1
            }

            Write-Host "FOUND: $file"
          }

          Write-Host ""
          Write-Host "All required files found."


      # 4. Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel


      # 5. Install project
      - name: Install FRIDAY dependencies
        shell: powershell
        run: |
          Write-Host "Installing FRIDAY project..."

          python -m pip install -e .

          if ($LASTEXITCODE -ne 0) {
            Write-Error "FRIDAY dependency installation failed."
            exit 1
          }

          Write-Host "FRIDAY dependencies installed."


      # 6. Install PyInstaller
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pyinstaller


      # 7. Verify PyInstaller
      - name: Verify PyInstaller
        run: |
          python -m PyInstaller --version


      # 8. Build Voice EXE
      - name: Build FRIDAY Voice EXE
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BUILDING FRIDAY VOICE"
          Write-Host "======================================"

          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name "FRIDAY-Voice" `
            "agent_friday.py"

          if (!(Test-Path "dist\FRIDAY-Voice.exe")) {
            Write-Error "FRIDAY-Voice.exe was not created."
            exit 1
          }

          Write-Host "FRIDAY-Voice.exe created."


      # 9. Build Server EXE
      - name: Build FRIDAY Server EXE
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BUILDING FRIDAY SERVER"
          Write-Host "======================================"

          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name "FRIDAY-Server" `
            "server.py"

          if (!(Test-Path "dist\FRIDAY-Server.exe")) {
            Write-Error "FRIDAY-Server.exe was not created."
            exit 1
          }

          Write-Host "FRIDAY-Server.exe created."


      # 10. Prepare release
      - name: Prepare release
        shell: powershell
        run: |
          Write-Host "Preparing release..."

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "release" | Out-Null

          Copy-Item `
            "dist\FRIDAY-Voice.exe" `
            "release\FRIDAY-Voice.exe"

          Copy-Item `
            "dist\FRIDAY-Server.exe" `
            "release\FRIDAY-Server.exe"

          if (Test-Path "README.md") {
            Copy-Item `
              "README.md" `
              "release\README.md"
          }

          if (Test-Path ".env.example") {
            Copy-Item `
              ".env.example" `
              "release\.env.example"
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RELEASE CONTENT"
          Write-Host "======================================"

          Get-ChildItem "release"


      # 11. Upload EXEs
      - name: Upload FRIDAY EXE
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Windows-EXE
          path: release
          if-no-files-found: error
          retention-days: 30
