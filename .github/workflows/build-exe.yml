name: Build FRIDAY EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------
      # 3. Verify project files
      # --------------------------------------------------
      - name: Verify FRIDAY project
        shell: powershell
        run: |
          Write-Host "===== PROJECT FILES ====="

          $required = @(
            "pyproject.toml",
            "agent_friday.py",
            "server.py"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              Write-Error "Missing required file: $file"
              exit 1
            }

            Write-Host "FOUND: $file"
          }

          if (Test-Path "friday") {
            Write-Host "FOUND: friday package"
            Get-ChildItem "friday" -Recurse | Select-Object FullName
          }
          else {
            Write-Error "ERROR: friday package folder is missing!"
            exit 1
          }

      # --------------------------------------------------
      # 4. Upgrade build tools
      # --------------------------------------------------
      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel hatchling

      # --------------------------------------------------
      # 5. Install project
      # --------------------------------------------------
      - name: Install FRIDAY dependencies
        shell: powershell
        run: |
          python -m pip install -e .

          # Keep MCP on the v1 API used by server.py
          python -m pip install --upgrade --force-reinstall "mcp>=1.28,<2"

      # --------------------------------------------------
      # 6. Verify MCP
      # --------------------------------------------------
      - name: Verify MCP FastMCP
        shell: powershell
        run: |
          python -c "import mcp; print('MCP version:', getattr(mcp, '__version__', 'unknown'))"
          python -c "from mcp.server.fastmcp import FastMCP; print('FastMCP import: OK')"

      # --------------------------------------------------
      # 7. Verify FRIDAY package
      # --------------------------------------------------
      - name: Verify FRIDAY package
        shell: powershell
        run: |
          python -c "import friday; print('FRIDAY package import: OK')"

      # --------------------------------------------------
      # 8. Install PyInstaller
      # --------------------------------------------------
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pyinstaller

      # --------------------------------------------------
      # 9. Build Voice EXE
      # --------------------------------------------------
      - name: Build FRIDAY Voice EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name "FRIDAY-Voice" `
            --collect-submodules friday `
            --collect-data friday `
            --hidden-import "friday" `
            --hidden-import "mcp.server.fastmcp" `
            "agent_friday.py"

      # --------------------------------------------------
      # 10. Build Server EXE
      # --------------------------------------------------
      - name: Build FRIDAY Server EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            --onefile `
            --name "FRIDAY-Server" `
            --collect-submodules friday `
            --collect-data friday `
            --hidden-import "friday" `
            --hidden-import "mcp.server.fastmcp" `
            "server.py"

      # --------------------------------------------------
      # 11. Verify EXEs
      # --------------------------------------------------
      - name: Verify built EXEs
        shell: powershell
        run: |
          if (!(Test-Path "dist\FRIDAY-Voice.exe")) {
            Write-Error "FRIDAY-Voice.exe was not created!"
            exit 1
          }

          if (!(Test-Path "dist\FRIDAY-Server.exe")) {
            Write-Error "FRIDAY-Server.exe was not created!"
            exit 1
          }

          Write-Host "FRIDAY-Voice.exe FOUND"
          Write-Host "FRIDAY-Server.exe FOUND"

          Get-Item "dist\FRIDAY-Voice.exe"
          Get-Item "dist\FRIDAY-Server.exe"

      # --------------------------------------------------
      # 12. Prepare release folder
      # --------------------------------------------------
      - name: Prepare release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "release" | Out-Null

          Copy-Item `
            "dist\FRIDAY-Voice.exe" `
            "release\FRIDAY-Voice.exe"

          Copy-Item `
            "dist\FRIDAY-Server.exe" `
            "release\FRIDAY-Server.exe"

          if (Test-Path "README.md") {
            Copy-Item "README.md" "release\README.md"
          }

          if (Test-Path ".env.example") {
            Copy-Item ".env.example" "release\.env.example"
          }

          Write-Host "===== RELEASE CONTENT ====="
          Get-ChildItem "release"

      # --------------------------------------------------
      # 13. Upload artifact
      # --------------------------------------------------
      - name: Upload FRIDAY Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Windows-EXE
          path: release
          if-no-files-found: error
          retention-days: 30
